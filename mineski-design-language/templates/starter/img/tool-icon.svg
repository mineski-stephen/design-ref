<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Relay">
<title>Relay</title>
<!-- Mineski app-icon recipe: 1024 tile, rx 184, pale tint of the brand hue,
     one bold flat subject in a deep ink, one orange accent. No text, no gradients. -->
<rect width="1024" height="1024" rx="184" fill="#DCF1ED"/>
<!-- the accent: a short motion trail -->
<path d="M196 694h170M240 774h110" stroke="#F58D36" stroke-width="56" stroke-linecap="round"/>
<!-- the subject: a paper plane, passing the request on -->
<path d="M262 512 820 262 676 800 528 610z" fill="#0F3B37"/>
<path d="M528 610 820 262 470 560z" fill="#0B7D6E"/>
<path d="M470 560 528 610 480 720z" fill="#0A2B28"/>
</svg>
